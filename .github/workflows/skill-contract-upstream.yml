name: Skill Contract (upstream caller)

# Reusable workflow: run the skill contract against an UPSTREAM PR's SDK so an
# interface change in the Traigent Python SDK gets an in-PR signal of which skills
# it would break. Call it from the SDK repo's PR CI (see docs/keeping-skills-in-sync.md):
#
#   jobs:
#     skill-contract:
#       uses: Traigent/traigent-skills/.github/workflows/skill-contract-upstream.yml@main
#
# Runs in the CALLER's context: checks out the caller's PR SDK, installs it, checks out
# the skills contract harness, and validates every taught Python fact against the PR SDK.
# Traigent/traigent-skills is public, so no token is needed and there is no skip path:
# the job either runs the contract or fails. A green result always means pytest ran.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk-skill-contract:
    name: sdk-skill-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The caller's GITHUB_TOKEN is needed for the checkout fetch only.
      # persist-credentials: false keeps it out of .git/config, so the untrusted
      # PR SDK installed and tested below cannot recover it.
      - name: Checkout caller PR (the SDK under change)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Pinned to the trusted `main` branch of THIS repo, never to a
      # caller-supplied ref. The previous version of this step took
      # `ref: ${{ inputs.skills_ref }}` -- an input the CALLING workflow
      # file sets, and for a `pull_request`-triggered caller that file is
      # read from the PR's own branch (non-privileged pull_request runs use
      # the PR's copy of the workflow YAML). That made `skills_ref`
      # attacker-influenced: a PR could override it to point this
      # then token-bearing checkout at an arbitrary ref, in the same job
      # that installs and executes the caller's own untrusted PR SDK
      # (previous step). CodeQL flagged exactly this. No caller currently
      # overrides skills_ref (grepped: no workspace repo passes it), so
      # hardcoding removes an unused, exploitable knob rather than breaking
      # anything. The checkout is anonymous: this repository is public.
      - name: Checkout skills contract harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Traigent/traigent-skills
          ref: main
          path: _skills
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install the PR SDK + harness deps
        run: |
          # Locked harness tooling from the skills repo's uv.lock (checked out in
          # _skills/), then the caller's PR build of the SDK (.) layered on top — the
          # SDK is the moving target here, so it is intentionally not in the lock.
          uv export --frozen --no-emit-project --no-hashes --project _skills -o harness-requirements.txt
          uv pip install --system -r harness-requirements.txt
          uv pip install --system .  # the caller's PR build of the SDK

      - name: Run the skill contract against the PR SDK
        run: |
          # --sdk-version=develop disables version-bucket gating so EVERY taught Python
          # fact is validated against the PR's installed SDK. Only the Python-surface tests
          # are run (BE/JS/ledger validate committed snapshots, not the SDK under change).
          python -m pytest \
            _skills/tests/contract/test_python_contracts.py \
            _skills/tests/contract/test_env_and_cli.py \
            _skills/tests/contract/test_skill_lints.py \
            _skills/tests/contract/test_text_requirements.py \
            _skills/tests/contract/test_harness_selftest.py \
            -p no:cacheprovider --sdk-version=develop -q -rs

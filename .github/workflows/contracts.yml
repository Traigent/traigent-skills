name: Skill Contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install locked quality tooling
        run: uv sync --frozen

      - name: Run the repository Python quality gate
        run: uv run ruff check .

  released-contracts:
    name: released-contracts
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # TraigentSchema is public and owns the economics vocabulary the skills
      # document. Without it test_economics_reference.py fails under CI rather
      # than skipping, so the cross-repo check always runs here.
      - name: Checkout TraigentSchema (public, read-only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Traigent/TraigentSchema
          path: _schema
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Cache uv downloads (traigent SDK buckets)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-traigent-${{ hashFiles('sync_map.yml') }}
          restore-keys: |
            ${{ runner.os }}-uv-traigent-

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install harness dependencies (locked)
        run: |
          uv export --frozen --no-emit-project --no-hashes -o harness-requirements.txt
          uv pip install --system -r harness-requirements.txt

      - name: Install bubblewrap (sandbox for the skill network tests)
        # Gives traigent-setup-audit's probe a real network namespace so its
        # sandbox cases run instead of self-skipping. Tolerated failure: if the
        # package or the runner's AppArmor policy refuses, those cases skip
        # exactly as they did before and nothing else is affected.
        run: |
          sudo apt-get update -qq \
            && sudo apt-get install -y --no-install-recommends bubblewrap \
            || echo "bubblewrap unavailable; sandbox tests will skip"

      - name: Run released SDK buckets
        env:
          TRAIGENT_SCHEMA_REPO: ${{ github.workspace }}/_schema
        run: |
          set -euo pipefail
          # Resolve the bucket list first: a failing list_buckets.py stops the
          # step here (a `< <(...)` process substitution would hide its exit
          # status), and an empty list is refused rather than testing nothing.
          buckets="$(python tools/contract/list_buckets.py)"
          if [ -z "$buckets" ]; then
            echo "::error::list_buckets.py produced no SDK buckets - refusing to report released contracts as green."
            exit 1
          fi
          # Locked harness tooling (harness-requirements.txt, derived from uv.lock) +
          # the matrix SDK version, which is intentionally NOT locked so every
          # released SDK is exercised against the same pinned harness.
          while IFS= read -r version; do
            [ -n "$version" ] || continue
            uv venv --python "$(command -v python)" ".bucket-$version"
            uv pip install --python ".bucket-$version/bin/python" \
              -r harness-requirements.txt "traigent==$version"
            ".bucket-$version/bin/python" -m pytest tests/contract --sdk-version="$version" -q
            # The bundled per-skill suites (skills/<name>/tests). They need only
            # the locked harness tooling already installed in this bucket venv --
            # both current suites are standard library plus pytest -- so they add
            # no dependency and run in the venv that is already built. They take
            # well under a minute, against a contract run of well over a minute
            # per bucket; the network-escape harness is the slow part, and its
            # sandbox cases skip themselves where no namespace backend exists.
            # A future skill whose tests need a
            # third-party package must either vendor a stub or get its own lane;
            # do not add the package here.
            ".bucket-$version/bin/python" -m pytest skills/*/tests -q
          done <<< "$buckets"

  develop-contracts:
    name: develop-contracts
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # TraigentSchema is public and owns the economics vocabulary the skills
      # document. Without it test_economics_reference.py fails under CI rather
      # than skipping, so the cross-repo check always runs here.
      - name: Checkout TraigentSchema (public, read-only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Traigent/TraigentSchema
          path: _schema
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install develop SDK and harness dependencies
        run: |
          # Locked harness tooling, then the develop SDK (a moving target by design,
          # so it stays out of the lock).
          uv export --frozen --no-emit-project --no-hashes -o harness-requirements.txt
          uv pip install --system -r harness-requirements.txt
          uv pip install --system "git+https://github.com/Traigent/Traigent@develop"

      - name: Run develop contract drift check
        id: contracts
        env:
          TRAIGENT_SCHEMA_REPO: ${{ github.workspace }}/_schema
        run: |
          set +e
          python -m pytest tests/contract --sdk-version=develop -q > contract-failures.txt 2>&1
          rc=$?
          set -e
          cat contract-failures.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            exit 0
          fi
          exit "$rc"

      - name: Create or update drift issue
        if: github.event_name == 'schedule' && steps.contracts.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Skill contract drift vs SDK develop
        run: |
          set -euo pipefail
          {
            echo "Nightly skill contract checks failed against Traigent develop."
            echo
            echo "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat contract-failures.txt
            echo '```'
          } > issue-body.md

          # Exact-title match over the open-issue list (not `--search`, whose
          # index lag has spawned duplicate drift issues) so a create-vs-edit
          # decision is deterministic. TITLE is passed as jq data via --arg,
          # never interpolated into a pattern. --limit covers >30 open issues.
          issue="$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // ""')"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi

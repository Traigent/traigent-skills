name: Skill Contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail-fast PR metadata check (owner ruling 2026-11-19): a PR with a bad body
  # fails here in seconds, before any expensive job starts. Every root job
  # `needs: pr-metadata`. This workflow does NOT trigger on `edited`; after fixing
  # the PR body, `gh run rerun <id> --failed` re-checks the current body (it is
  # fetched from the API, not read from the original event payload).
  # The PR body is untrusted: it reaches scripts only through env vars. The
  # base-branch copy of the checker decides; the head copy runs only on the
  # bootstrap PR that adds it. Push/schedule/merge_group runs pass through.
  pr-metadata:
    name: pr-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "no PR body to check on ${{ github.event_name }}; the PR's own run gated it"
      - name: Fetch the current PR body and author
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/pr_body"
          gh api "repos/$REPO/pulls/$PR" --jq '.user.login' > "$RUNNER_TEMP/pr_author"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          path: head
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check ticket and security note
        if: github.event_name == 'pull_request'
        run: |
          PR_BODY="$(cat "$RUNNER_TEMP/pr_body")"; export PR_BODY
          PR_AUTHOR="$(cat "$RUNNER_TEMP/pr_author")"; export PR_AUTHOR
          if [ -f base/.github/scripts/check_pr_ticket_security.py ]; then
            python3 base/.github/scripts/check_pr_ticket_security.py
          else
            echo "::warning::checker not on the base branch yet (bootstrap PR); running the PR's copy"
            python3 head/.github/scripts/check_pr_ticket_security.py
          fi
      - name: Check spine mark
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ "$(cat "$RUNNER_TEMP/pr_author")" = "dependabot[bot]" ]; then
            echo "Dependabot PR: exempt from the spine-mark requirement."
            exit 0
          fi
          PR_BODY="$(cat "$RUNNER_TEMP/pr_body")"
          trail='^[[:space:]]*Spine-Trail:[[:space:]]*st_[0-9a-f]{12}[[:space:]]*$'
          session='^[[:space:]]*Spine:[[:space:]]*cs_[0-9a-z]{6,}[[:space:]]*$'
          waiver='^[[:space:]]*Spine:[[:space:]]*none[[:space:]]*\(reason:.+\)[[:space:]]*$'
          if printf '%s\n' "$PR_BODY" | grep -Eqi "$trail"; then
            echo "Spine-Trail present."
          elif printf '%s\n' "$PR_BODY" | grep -Eqi "$session"; then
            echo "Promoted ChangeSession (Spine:) present."
          elif printf '%s\n' "$PR_BODY" | grep -Eqi "$waiver"; then
            echo "Explicit governance waiver (Spine: none) accepted."
          else
            echo "::error title=Spine trail missing::This product PR has no validation-spine mark."
            echo "Add ONE line to the PR body: Spine-Trail: st_xxxxxxxxxxxx | Spine: cs_xxxxxxxx | Spine: none (reason: <why>)"
            exit 1
          fi

  python-quality:
    name: python-quality
    needs: pr-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install locked quality tooling
        run: uv sync --frozen

      - name: Run the repository Python quality gate
        run: uv run ruff check .

  # released-contracts is split into three jobs so that each released SDK
  # bucket gets its own runner (and its own 20-minute clock) instead of
  # running all buckets back-to-back in one job that can time out partway
  # through the last bucket. `released-contracts` is a required status check
  # on main by exact name (see branches/main/protection/required_status_checks),
  # so it stays as a real job here -- an aggregator that fans out to the
  # matrix below and fails if any bucket failed -- rather than being renamed
  # away by the matrix, which would silently stop protecting main.
  released-contracts-buckets:
    name: released-contracts-buckets
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: pr-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      buckets: ${{ steps.list.outputs.buckets }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install harness dependencies (locked)
        run: |
          uv export --frozen --no-emit-project --no-hashes -o harness-requirements.txt
          uv pip install --system -r harness-requirements.txt

      - name: List released SDK buckets
        id: list
        run: |
          set -euo pipefail
          # Resolve the bucket list first: a failing list_buckets.py stops the
          # step here (a `< <(...)` process substitution would hide its exit
          # status), and an empty list is refused rather than fanning out into
          # a zero-bucket, trivially "successful" matrix (traigent-skills#347
          # item E).
          buckets="$(python tools/contract/list_buckets.py)"
          if [ -z "$buckets" ]; then
            echo "::error::list_buckets.py produced no SDK buckets - refusing to report released contracts as green."
            exit 1
          fi
          echo "buckets=$(python tools/contract/list_buckets.py --json)" >> "$GITHUB_OUTPUT"

  released-contracts-bucket:
    name: released-contracts (${{ matrix.bucket }})
    needs: released-contracts-buckets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJson(needs.released-contracts-buckets.outputs.buckets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # TraigentSchema is public and owns the economics vocabulary the skills
      # document. Without it test_economics_reference.py fails under CI rather
      # than skipping, so the cross-repo check always runs here.
      - name: Checkout TraigentSchema (public, read-only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Traigent/TraigentSchema
          path: _schema
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Cache uv downloads (traigent SDK buckets)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-traigent-${{ matrix.bucket }}-${{ hashFiles('sync_map.yml') }}
          restore-keys: |
            ${{ runner.os }}-uv-traigent-${{ matrix.bucket }}-
            ${{ runner.os }}-uv-traigent-

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install harness dependencies (locked)
        run: |
          uv export --frozen --no-emit-project --no-hashes -o harness-requirements.txt
          uv pip install --system -r harness-requirements.txt

      - name: Install bubblewrap (sandbox for the skill network tests)
        # Gives traigent-setup-audit's probe a real network namespace so its
        # sandbox cases run instead of self-skipping. Tolerated failure: if the
        # package or the runner's AppArmor policy refuses, those cases skip
        # exactly as they did before and nothing else is affected.
        run: |
          sudo apt-get update -qq \
            && sudo apt-get install -y --no-install-recommends bubblewrap \
            || echo "bubblewrap unavailable; sandbox tests will skip"

      - name: Run released SDK bucket
        env:
          BUCKET_VERSION: ${{ matrix.bucket }}
          TRAIGENT_SCHEMA_REPO: ${{ github.workspace }}/_schema
        run: |
          set -euo pipefail
          # Locked harness tooling (harness-requirements.txt, derived from uv.lock) +
          # the matrix SDK version, which is intentionally NOT locked so every
          # released SDK is exercised against the same pinned harness.
          version="$BUCKET_VERSION"
          uv venv --python "$(command -v python)" ".bucket-$version"
          uv pip install --python ".bucket-$version/bin/python" \
            -r harness-requirements.txt "traigent==$version"
          ".bucket-$version/bin/python" -m pytest tests/contract --sdk-version="$version" -q
          # The bundled per-skill suites (skills/<name>/tests). They need only
          # the locked harness tooling already installed in this bucket venv --
          # both current suites are standard library plus pytest -- so they add
          # no dependency and run in the venv that is already built. They take
          # well under a minute, against a contract run of well over a minute
          # per bucket; the network-escape harness is the slow part, and its
          # sandbox cases skip themselves where no namespace backend exists.
          # A future skill whose tests need a
          # third-party package must either vendor a stub or get its own lane;
          # do not add the package here.
          ".bucket-$version/bin/python" -m pytest skills/*/tests -q

  released-contracts:
    name: released-contracts
    needs: [pr-metadata, released-contracts-buckets, released-contracts-bucket]
    # always() is required here: GitHub's default `if: success()` for a job
    # with `needs` means that when a matrix bucket fails, this aggregator
    # would be SKIPPED rather than run -- and a skipped required check counts
    # as passing for branch protection, so a real bucket failure would not
    # block merge. always() makes the aggregator run regardless of upstream
    # result; the event-name/ref condition (matching released-contracts-buckets'
    # own `if`) keeps it from being forced to run -- and then failing, since
    # its needs are legitimately skipped -- on triggers where released
    # contracts doesn't apply (e.g. a push to develop).
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm every released SDK bucket passed
        run: |
          echo "pr-metadata: ${{ needs.pr-metadata.result }}"
          echo "released-contracts-buckets: ${{ needs.released-contracts-buckets.result }}"
          echo "released-contracts-bucket:  ${{ needs.released-contracts-bucket.result }}"
          if [ "${{ needs.pr-metadata.result }}" != "success" ] || \
             [ "${{ needs.released-contracts-buckets.result }}" != "success" ] || \
             [ "${{ needs.released-contracts-bucket.result }}" != "success" ]; then
            echo "pr-metadata failed, or one or more released SDK buckets failed (or the bucket list job did)." >&2
            exit 1
          fi

  develop-contracts:
    name: develop-contracts
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    needs: pr-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # TraigentSchema is public and owns the economics vocabulary the skills
      # document. Without it test_economics_reference.py fails under CI rather
      # than skipping, so the cross-repo check always runs here.
      - name: Checkout TraigentSchema (public, read-only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Traigent/TraigentSchema
          path: _schema
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.11"

      - name: Install develop SDK and harness dependencies
        run: |
          # Locked harness tooling, then the develop SDK (a moving target by design,
          # so it stays out of the lock).
          uv export --frozen --no-emit-project --no-hashes -o harness-requirements.txt
          uv pip install --system -r harness-requirements.txt
          uv pip install --system "git+https://github.com/Traigent/Traigent@develop"

      - name: Run develop contract drift check
        id: contracts
        env:
          TRAIGENT_SCHEMA_REPO: ${{ github.workspace }}/_schema
        run: |
          set +e
          python -m pytest tests/contract --sdk-version=develop -q > contract-failures.txt 2>&1
          rc=$?
          set -e
          cat contract-failures.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            exit 0
          fi
          exit "$rc"

      - name: Create or update drift issue
        if: github.event_name == 'schedule' && steps.contracts.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Skill contract drift vs SDK develop
        run: |
          set -euo pipefail
          # The issue body and the per-run comment carry only the run URL and
          # failing test ids; no raw test output is copied. Ids come from
          # pytest's "FAILED "/"ERROR " summary lines, are cut at the first
          # space, and must match a strict path pattern.
          ids="$(grep -E '^(FAILED|ERROR) ' contract-failures.txt \
            | sed -E 's/^(FAILED|ERROR) //; s/[[:space:]].*$//' \
            | grep -E '^tests/[A-Za-z0-9_./-]+\.py(::[][A-Za-z0-9_./,=-]+)*$' \
            | awk '!seen[$0]++' || true)"
          total="$(printf '%s' "$ids" | grep -c . || true)"
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Failing tests (${total}):"
            printf '%s\n' "$ids" | sed -n '1,20p' | sed '/^$/d; s/^/- /'
            if [ "$total" -gt 20 ]; then
              echo "... and $((total - 20)) more"
            fi
          } > details.md
          {
            echo "Nightly skill contract checks failed against Traigent develop."
            echo
            cat details.md
          } > issue-body.md

          # Exact-title match over the open-issue list (not `--search`, whose
          # index lag has spawned duplicate drift issues) so a create-vs-edit
          # decision is deterministic. TITLE is passed as jq data via --arg,
          # never interpolated into a pattern. --limit covers >30 open issues.
          issue="$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // ""')"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file issue-body.md
          else
            url="$(gh issue create --title "$TITLE" --body-file issue-body.md)"
            issue="${url##*/}"
          fi
          gh issue comment "$issue" --body-file details.md

      - name: Fail the scheduled run when contracts failed
        if: github.event_name == 'schedule' && steps.contracts.outputs.rc != '0'
        run: |
          echo "Scheduled develop contract check failed (rc=${{ steps.contracts.outputs.rc }}); see the drift issue." >&2
          exit 1

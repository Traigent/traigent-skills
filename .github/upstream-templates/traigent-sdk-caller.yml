# Drop this into Traigent/.github/workflows/skill-contract.yml (the Python SDK repo).
# It calls the reusable workflow in traigent-skills so that a PR which changes the SDK's
# public surface gets an in-PR signal of which skills it would break. No secret is needed:
# Traigent/traigent-skills is public, and the reusable workflow always runs the contract.
name: Skill Contract

on:
  pull_request:
    paths:
      - "traigent/**/*.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  skill-contract:
    uses: Traigent/traigent-skills/.github/workflows/skill-contract-upstream.yml@main

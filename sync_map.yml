version: 1
sdk:
  dist: traigent
  github: Traigent/Traigent
default_min_sdk_version: "0.15.0"
# Keep this pinned and update it when a new PyPI release should be covered by
# per-PR released-contracts. Do not resolve PyPI live in PR CI.
current_released_sdk_version: "0.21.3"
skills:
  traigent-setup-quickstart:
    env_version_floors:
      # TRAIGENT_LOG_LEVEL ships in traigent>=0.13.0; the reference table row
      # carries the version note in prose.
      TRAIGENT_LOG_LEVEL: "0.13.0.dev1"
    sdk_paths:
      - traigent/utils/cost_calculator.py
      - traigent/core/cost_estimator.py
    docs:
      - docs/getting-started/*
      - docs/features/safety-gates.md
      - pyproject.toml
      - examples/quickstart/

  traigent-js:
    js: true
    docs:
      - traigent-js/src/optimization/*
      - traigent-js/src/core/context.ts
      - traigent-js/src/seamless/*
      - traigent-js/src/integrations/*
      - traigent-js/src/routing/*
      - traigent-js/README.md
      - traigent-js/docs/*

  traigent-optimize-config-space:
    modules:
      - traigent.api.parameter_ranges
      - traigent.api.constraint_builders
    sdk_paths:
      - traigent/api/parameter_ranges.py
      - traigent/api/constraint_builders.py
    docs:
      - docs/user-guide/tuned_variables.md

  traigent-setup-decorator:
    modules:
      - traigent.api.decorators
    sdk_paths:
      - traigent/api/decorators.py
      - traigent/utils/cost_calculator.py
      - traigent/core/cost_estimator.py
    docs:
      - docs/user-guide/injection_modes.md
      - docs/features/safety-gates.md

  traigent-optimize-run:
    modules:
      - traigent.core.optimized_function
      - traigent.core.orchestrator
      - traigent.config.parallel
    sdk_paths:
      - traigent/core/optimized_function.py
      - traigent/core/orchestrator.py
      - traigent/config/parallel.py

  traigent-analyze-results:
    backend_prefixes:
      - /api/v1/experiment-groups
    modules:
      - traigent.api.types
      - traigent.core.optimized_function
    sdk_paths:
      - traigent/api/types.py
      - traigent/core/optimized_function.py

  traigent-setup-integrations:
    sdk_paths:
      - traigent/integrations/*
    docs:
      - docs/architecture/integrations-inventory.md

  traigent-debugging:
    env_version_floors:
      # TRAIGENT_LOG_LEVEL ships in traigent>=0.13.0 (utils/logging.py); the
      # skill notes the version requirement in prose next to the variable.
      TRAIGENT_LOG_LEVEL: "0.13.0.dev1"
    modules:
      - traigent.utils.exceptions
      - traigent.utils.env_config
    sdk_paths:
      - traigent/utils/exceptions.py
      - traigent/utils/env_config.py

  traigent-optimize-composite-knobs:
    min_sdk_version: "0.15.0"
    modules:
      - traigent.knobs.patterns
      - traigent.knobs.runtime
      - traigent.knobs.telemetry
    sdk_paths:
      - traigent/knobs/patterns.py
      - traigent/knobs/runtime.py
      - traigent/knobs/telemetry.py
    docs:
      - examples/advanced/composite-knobs/*
      - docs/traceability/concepts/composite-knobs.md

  # Union of the former traigent-boost-agent entry and the retired bare
  # `traigent` key (folded in during the 2026-07 taxonomy consolidation).
  traigent-boost-agent:
    min_sdk_version: "0.15.0"
    backend_prefixes:
      - /api/v1/analytics/runs
    modules:
      - traigent.config_generator.recommendations
      - traigent.api.decorators
      - traigent.core.optimized_function
      - traigent.knobs.patterns
      - traigent.knobs.runtime
      - traigent.knobs.telemetry
      - traigent.utils.insights
      - traigent.utils.importance
      - traigent.utils.env_config
      - traigent.analytics
    sdk_paths:
      - traigent/config_generator/recommendations.py
      - traigent/config_generator/catalog/tvar_catalog.v1.json
      - traigent/api/decorators.py
      - traigent/core/optimized_function.py
      - traigent/knobs/patterns.py
      - traigent/knobs/runtime.py
      - traigent/knobs/telemetry.py
      - traigent/utils/insights.py
      - traigent/utils/importance.py
      - traigent/utils/env_config.py
      - traigent/utils/cost_calculator.py
      - traigent/core/cost_estimator.py
      - traigent/analytics/example_insights.py
      - traigent/testing/*

  traigent-analyze-variable-importance:
    modules:
      - traigent.utils.importance
      - traigent.utils.insights
    sdk_paths:
      - traigent/utils/importance.py
      - traigent/utils/insights.py
    docs:
      - optimization trial artifact schema

  # Union of the two dataset-curation entries this skill was merged from
  # (curate-dataset, plus the reflect-on-hard-examples skill), folded in
  # during the 2026-07 taxonomy consolidation.
  traigent-dataset-curate:
    min_sdk_version: "0.16.0"
    backend_prefixes:
      - /api/v1/datasets
      - /api/v1/analytics/example-scoring
      - /api/v1/analytics/experiments
      - /api/v1/analytics/runs
    modules:
      - traigent.generation
      - traigent.analytics
      - traigent.evaluators
      - traigent.api.decorators
      - traigent.testing
      - traigent.core.optimized_function
    sdk_paths:
      - traigent/generation/*
      - traigent/analytics/example_insights.py
      - traigent/evaluators/base.py
      - traigent/api/decorators.py
      - traigent/core/optimized_function.py
      - traigent/testing/*

  traigent-eval-choose-metric:
    modules:
      - traigent.api.decorators
    sdk_paths:
      - traigent/api/decorators.py
      - traigent/core/optimized_function.py

  traigent-eval-build:
    modules:
      - traigent.api.decorators
      - traigent.api.types
      - traigent.evaluators
      - traigent.evaluators.base
    sdk_paths:
      - traigent/api/decorators.py
      - traigent/api/types.py
      - traigent/evaluators/base.py
      - traigent/evaluators/local.py
      - traigent/evaluators/hybrid_api.py

  traigent-eval-audit:
    backend_prefixes:
      - /api/v1/analytics/runs
    modules:
      - traigent.api.decorators
      - traigent.api.types
    sdk_paths:
      - traigent/api/decorators.py
      - traigent/api/types.py

  traigent-ci-safety-gate:
    modules:
      - traigent.api.decorators
      - traigent.api.safety
      - traigent.tvl.promotion_gate
      - traigent.tvl.models
    sdk_paths:
      - traigent/api/decorators.py
      - traigent/api/safety.py
      - traigent/tvl/promotion_gate.py
      - traigent/tvl/models.py
      - traigent/tvl/__main__.py

  # Union of the three guidance-flow entries this skill was merged from
  # (run-plan, next-run, iterate), folded in during the 2026-07 taxonomy
  # consolidation.
  traigent-analyze-guidance:
    min_sdk_version: "0.21.3"
    backend_prefixes:
      - /api/v1/experiment-runs
      - /api/v1/optimization-comparisons
      - /api/v1/analytics/example-scoring
      - /api/v1/analytics/runs
    modules:
      - traigent.api.decorators
      - traigent.core.optimized_function
      - traigent.api.types
      - traigent.utils.insights
      - traigent.utils.importance
      - traigent.analytics
      - traigent.analytics.planner
      - traigent.cli.guidance_command
    sdk_paths:
      - traigent/api/decorators.py
      - traigent/core/optimized_function.py
      - traigent/api/types.py
      - traigent/utils/insights.py
      - traigent/utils/importance.py
      - traigent/analytics/example_insights.py
      - traigent/analytics/planner.py
      - traigent/cli/guidance_command.py

  traigent-recipe-text2sql:
    min_sdk_version: "0.16.0"
    modules:
      - traigent
      - traigent.api.decorators
      - traigent.core.objectives
      - traigent.evaluators.base
      - traigent.testing
    sdk_paths:
      - traigent/__init__.py
      - traigent/api/decorators.py
      - traigent/core/objectives.py
      - traigent/evaluators/base.py
      - traigent/testing/*
      - traigent/core/optimized_function.py

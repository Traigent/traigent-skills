# Coverage ("should-use") ledger.
#
# The interface inventory baseline lives in tests/data/interface_inventory.json (generated by
# tools/contract/build_interface_inventory.py). When a snapshot refresh introduces a NEW interface
# element (new JS export / backend route), the coverage-ledger test requires that element to be
# either taught by a skill (auto-derived from the contract facts) OR waived here. This is the
# "should-use" gate: a new capability surfaces a decision rather than shipping unmentioned.
#
# Add a waiver only when a new element deliberately needs no skill (internal/advanced/not-yet-surfaced):
#
#   waivers:
#     "js:@traigent/sdk#SomeInternalType":
#       reason: internal type, not user-facing
#       owner: <github-handle>
schema: coverage-ledger/v1
waivers: {}

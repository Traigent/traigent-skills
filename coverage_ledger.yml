# Coverage ("should-use") ledger.
#
# The interface inventory baseline lives in tests/data/interface_inventory.json (generated by
# tools/contract/build_interface_inventory.py). When a snapshot refresh introduces a NEW interface
# element, the coverage-ledger test requires that element to be either taught by a skill
# (auto-derived from the contract facts) OR waived here. This is the "should-use" gate: a new
# capability surfaces a decision rather than shipping unmentioned.
#
# Inventory kinds (ids) folded into tests/data/interface_inventory.json:
#   js:@traigent/sdk[/sub]#<symbol>   — JS SDK export        (tests/data/js_api_snapshot.json)
#   be:<METHOD> <path_template>       — backend route        (tests/data/backend_routes_snapshot.json)
#   py:optimize#<kwarg>               — @traigent.optimize kwarg (tests/data/python_api_snapshot.json)
#   py:EvaluationOptions#<field>      — option-bundle field  (also Injection/ExecutionOptions)
#   py:exception#<ClassName>          — public SDK exception
#   py:cli#<command path>             — traigent CLI subcommand
#
# Add a waiver only when a new element deliberately needs no skill (internal/advanced/not-yet-surfaced):
#
#   waivers:
#     "py:optimize#some_internal_kwarg":
#       reason: internal/advanced kwarg, not user-facing
#       owner: <github-handle>
schema: coverage-ledger/v1
